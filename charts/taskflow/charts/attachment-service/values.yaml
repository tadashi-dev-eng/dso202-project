# charts/taskflow/charts/attachment-service/values.yaml -- TaskFlow
# What attachment-service is and what it may talk to. Environment-level settings
# (replicas, autoscaling, PDBs) are set by the umbrella chart's values.
database:
  enabled: true
  name: attachments   # own database and role on the shared PostgreSQL
nats: true         # publishes/consumes events on NATS JetStream
objectStore: true  # S3 credentials from taskflow-objectstore
networkPolicy:
  from:
    - api-gateway
  to:
    - task-service
