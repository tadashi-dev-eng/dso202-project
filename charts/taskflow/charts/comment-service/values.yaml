# charts/taskflow/charts/comment-service/values.yaml -- TaskFlow
# What comment-service is and what it may talk to. Environment-level settings
# (replicas, autoscaling, PDBs) are set by the umbrella chart's values.
database:
  enabled: true
  name: comments   # own database and role on the shared PostgreSQL
nats: true         # publishes/consumes events on NATS JetStream
networkPolicy:
  from:
    - api-gateway
  to:
    - task-service
    - user-service
