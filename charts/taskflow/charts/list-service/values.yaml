# charts/taskflow/charts/list-service/values.yaml -- TaskFlow
# What list-service is and what it may talk to. Environment-level settings
# (replicas, autoscaling, PDBs) are set by the umbrella chart's values.
database:
  enabled: true
  name: lists   # own database and role on the shared PostgreSQL
nats: true         # publishes/consumes events on NATS JetStream
networkPolicy:
  from:
    - api-gateway
    - task-service
    - search-service
    - notification-service
  to:
    - user-service
