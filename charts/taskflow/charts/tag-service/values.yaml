# charts/taskflow/charts/tag-service/values.yaml -- TaskFlow
# What tag-service is and what it may talk to. Environment-level settings
# (replicas, autoscaling, PDBs) are set by the umbrella chart's values.
database:
  enabled: true
  name: tags   # own database and role on the shared PostgreSQL
nats: true         # publishes/consumes events on NATS JetStream
networkPolicy:
  from:
    - api-gateway
  to:
    - task-service
