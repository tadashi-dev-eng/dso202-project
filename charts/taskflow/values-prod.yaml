# charts/taskflow/values-prod.yaml -- the prod-like environment (namespace taskflow-prod).
#
# High availability: every service runs at least two replicas spread over
# the two worker zones, with a PodDisruptionBudget so a node drain always
# leaves one serving. Three services autoscale:
#   api-gateway          CPU utilisation            2..6
#   task-service         requests/second per pod    2..8   (custom metric)
#   notification-service JetStream backlog          2..8   (external metric)
# Sizing rationale: docs/capacity-plan.md.
global:
  environment: prod
  config:
    LOG_LEVEL: INFO
    OTEL_TRACES_SAMPLER_ARG: "0.5"   # sample half the traces in prod
ingress:
  host: app.taskflow.localhost

x-ha: &ha
  replicaCount: 2
  pdb: {enabled: true, minAvailable: 1}

web-frontend: *ha
api-gateway:
  <<: *ha
  resources:
    requests: {cpu: 100m, memory: 112Mi}
    limits: {cpu: "1", memory: 256Mi}
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    cpu: 70
auth-service: *ha
user-service: *ha
list-service: *ha
task-service:
  <<: *ha
  resources:
    requests: {cpu: 50m, memory: 96Mi}
    limits: {cpu: 500m, memory: 256Mi}
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    # Prometheus Adapter: rate(http_server_requests_total[1m]) per Pod
    podsMetric:
      name: http_requests_per_second
      target: "10"
tag-service: *ha
comment-service: *ha
attachment-service: *ha
reminder-service: *ha
recurrence-service: *ha
notification-service:
  <<: *ha
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    # Prometheus Adapter: max(taskflow_notification_backlog) in this namespace
    externalMetric:
      name: taskflow_notification_backlog
      selector:
        namespace: taskflow-prod
      target: "20"
search-service: *ha
analytics-service: *ha
audit-service: *ha
