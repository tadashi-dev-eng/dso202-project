# deploy/argocd/apps/10-platform.yaml -- cluster add-ons.
# Sync waves order them: Sealed Secrets (its CRD) before any SealedSecret,
# the ingress controller before anything with an Ingress.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-9"
spec:
  # Argo CD manages its own installation and settings from Git. prune is
  # off: removing a file here must never uninstall Argo CD itself.
  project: platform
  source:
    repoURL: https://github.com/tadashi-dev-eng/dso202-project.git
    targetRevision: main
    path: deploy/argocd/bootstrap
  destination: {server: https://kubernetes.default.svc, namespace: argocd}
  syncPolicy:
    automated: {prune: false, selfHeal: true}
    syncOptions: [ServerSideApply=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: platform
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.20.0          # controller 0.40.0
    helm:
      releaseName: sealed-secrets
      valuesObject:
        # kubeseal's default controller name, so no --controller-name flag.
        fullnameOverride: sealed-secrets-controller
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {cpu: 200m, memory: 128Mi}
  destination: {server: https://kubernetes.default.svc, namespace: sealed-secrets}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: platform
  source:
    repoURL: https://github.com/tadashi-dev-eng/dso202-project.git
    targetRevision: main
    path: platform/ingress-nginx
  destination: {server: https://kubernetes.default.svc, namespace: ingress-nginx}
  # platform/ingress-nginx/kustomization.yaml turns the admission Jobs into
  # Sync hooks and the Service into NodePort (see the comments there).
  syncPolicy:
    automated: {prune: true, selfHeal: true}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-secrets
  namespace: argocd
  annotations:
    # After the controller (-8): the SealedSecret CRD must exist.
    argocd.argoproj.io/sync-wave: "-7"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  # TLS certificate for the add-on namespaces, sealed for each namespace.
  project: platform
  source:
    repoURL: https://github.com/tadashi-dev-eng/dso202-project.git
    targetRevision: main
    path: deploy/platform-secrets
  destination: {server: https://kubernetes.default.svc, namespace: argocd}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
    retry:
      limit: 10
      backoff: {duration: 10s, factor: 2, maxDuration: 3m}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-operator-crds
  namespace: argocd
  annotations:
    # The ServiceMonitor / PrometheusRule CRDs must exist before any chart
    # that contains them (every TaskFlow service has a ServiceMonitor).
    argocd.argoproj.io/sync-wave: "-8"
spec:
  project: platform
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-operator-crds
    targetRevision: 33.0.2          # operator v0.95.2, same as kube-prometheus-stack 93.10.0
  destination: {server: https://kubernetes.default.svc, namespace: observability}
  syncPolicy:
    automated: {prune: false, selfHeal: true}
    # CRDs are too large for client-side apply's last-applied annotation.
    syncOptions: [ServerSideApply=true, CreateNamespace=true]
