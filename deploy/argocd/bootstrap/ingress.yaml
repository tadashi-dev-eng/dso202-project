# Argo CD UI and API at https://argocd.taskflow.localhost (TLS at the
# ingress controller; the wildcard certificate arrives as a SealedSecret).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
spec:
  ingressClassName: nginx
  tls:
    - hosts: [argocd.taskflow.localhost]
      secretName: taskflow-tls
  rules:
    - host: argocd.taskflow.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port: {number: 80}
