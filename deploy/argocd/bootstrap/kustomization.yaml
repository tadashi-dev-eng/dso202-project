# deploy/argocd/bootstrap/kustomization.yaml -- TaskFlow (DSO202 final project)
#
# The one thing applied by hand: Argo CD itself.
#
#   kubectl apply -k deploy/argocd/bootstrap --server-side --force-conflicts
#   kubectl apply -f deploy/argocd/root/root-app.yaml
#
# After that, everything (including later changes to Argo CD's own
# settings, via the argocd-config Application) arrives from Git.
#
# The upstream manifest is pinned to an immutable release tag: "stable"
# would mean something different next week, which breaks the "versioned
# and immutable" GitOps principle. An upgrade is a reviewed one-line change.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - namespace.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.6.1/manifests/install.yaml
  - ingress.yaml
patches:
  - path: argocd-cm.yaml
  - path: argocd-cmd-params-cm.yaml
  - path: argocd-rbac-cm.yaml
  # Upstream Argo CD declares no resources, which makes its Pods
  # "BestEffort": the first evicted under memory pressure. Requests sized
  # from measurement (controller ~340 Mi, repo-server/server ~60 Mi) make
  # them Burstable and count them in the scheduler's capacity arithmetic.
  - target: {kind: StatefulSet, name: argocd-application-controller}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {requests: {cpu: 100m, memory: 320Mi}, limits: {memory: 768Mi}}
  - target: {kind: Deployment, name: argocd-repo-server}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {requests: {cpu: 20m, memory: 96Mi}, limits: {memory: 512Mi}}
  - target: {kind: Deployment, name: argocd-server}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {requests: {cpu: 10m, memory: 48Mi}, limits: {memory: 256Mi}}
  - target: {kind: Deployment, name: argocd-redis}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 128Mi}}
  # Dex (SSO connector) is not used: local accounts + RBAC only. Scaling it
  # to zero saves memory on the laptop cluster.
  - target: {kind: Deployment, name: argocd-dex-server}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
