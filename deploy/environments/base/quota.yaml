# deploy/environments/base/quota.yaml
# ResourceQuota caps what the whole namespace may request, so one
# environment (or a runaway autoscaler) cannot starve the others on the
# shared cluster. LimitRange gives any container that forgets to declare
# resources a sane default, and bounds a single container's size.
# The numbers are dev-sized; the prod overlay raises them (see
# docs/capacity-plan.md for how they were derived).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: taskflow-quota
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 3Gi
    limits.cpu: "16"
    limits.memory: 8Gi
    pods: "40"
    persistentvolumeclaims: "10"
    requests.storage: 10Gi
    services.nodeports: "0"          # no NodePorts: traffic enters via the Ingress
    services.loadbalancers: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: taskflow-limits
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 20m, memory: 64Mi}
      default: {cpu: 250m, memory: 128Mi}
      max: {cpu: "2", memory: 1Gi}
    - type: PersistentVolumeClaim
      max: {storage: 5Gi}
