# deploy/environments/overlays/dev/kustomization.yaml
# dev: the base as-is, in namespace taskflow-dev. Developers keep exec and
# Pod restarts here (the base Role) for debugging.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: taskflow-dev
resources:
  - ../../base
  - sealed-secrets.yaml      # credentials, encrypted (scripts/seal-secrets.sh)
patches:
  - target: {kind: Namespace, name: taskflow-env}
    patch: |-
      - op: replace
        path: /metadata/name
        value: taskflow-dev
labels:
  - pairs:
      taskflow.io/environment: dev
    includeSelectors: false
