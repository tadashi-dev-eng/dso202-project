# Strategic-merge patch: prod quota. Sized for the HPA maxima in
# charts/taskflow/values-prod.yaml (docs/capacity-plan.md, section 3).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: taskflow-quota
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 6Gi
    limits.cpu: "32"
    limits.memory: 16Gi
    pods: "80"
    persistentvolumeclaims: "10"
    requests.storage: 16Gi
