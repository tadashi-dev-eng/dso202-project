# deploy/observability/kustomization.yaml -- TaskFlow (DSO202 final project)
# Observability configuration as code, synced by the observability-config
# Application:
#   dashboards/*.json   generated by scripts/gen_dashboards.py; each becomes a
#                       ConfigMap the Grafana sidecar loads (folder "TaskFlow")
#   alerts.yaml         PrometheusRule: recording rules and alerts
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
resources:
  - alerts.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: TaskFlow
configMapGenerator:
  - name: dashboard-taskflow-app
    files: [dashboards/taskflow-app.json]
  - name: dashboard-taskflow-infra
    files: [dashboards/taskflow-infra.json]
