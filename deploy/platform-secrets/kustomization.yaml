# deploy/platform-secrets/kustomization.yaml -- TaskFlow (DSO202 final project)
# SealedSecrets for the add-on namespaces (generated by scripts/seal-secrets.sh):
#   argocd         taskflow-tls (wildcard certificate for the Ingress)
#   observability  taskflow-tls, grafana-admin
#   cicd           taskflow-tls, jenkins-admin
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - argocd.yaml
  - observability.yaml
  - cicd.yaml
