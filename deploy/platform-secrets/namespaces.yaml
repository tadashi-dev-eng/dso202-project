# Namespaces for the add-ons, created here so their SealedSecrets can be
# applied before the add-on charts arrive.
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels: {app.kubernetes.io/part-of: taskflow-platform}
---
apiVersion: v1
kind: Namespace
metadata:
  name: cicd
  labels:
    app.kubernetes.io/part-of: taskflow-platform
    # baseline, not restricted: Kaniko runs as root inside its container
    # (no privileged mode, host access or extra capabilities).
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
