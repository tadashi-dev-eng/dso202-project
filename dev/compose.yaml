# dev/compose.yaml -- TaskFlow local smoke-test harness (NOT the deployment).
# Runs the infrastructure plus the core services on one Docker network so
# the service code can be exercised before it is packaged for Kubernetes.
#
#   docker compose -f dev/compose.yaml up -d --build
#   curl http://localhost:8000/api
#
# Credentials here are throwaway development values.

x-service: &service
  build:
    context: ../services
    dockerfile: Dockerfile
  restart: on-failure
  environment: &env
    NATS_URL: nats://nats:4222
    REDIS_URL: redis://redis:6379/0
    ETCD_ENDPOINT: http://etcd:2379
    DB_HOST: postgres
    JWT_SECRET: dev-only-secret
    LOG_LEVEL: INFO
  depends_on: [postgres, nats, redis, etcd]

services:
  postgres:
    image: postgres:17.2-alpine
    environment:
      POSTGRES_PASSWORD: dev-admin
    volumes:
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
  redis:
    image: redis:7.4.1-alpine
  nats:
    image: nats:2.10.22-alpine
    command: ["-js", "-m", "8222"]
  objectstore:
    # S3-compatible store for attachments (SeaweedFS: MinIO no longer
    # publishes container images).
    image: chrislusf/seaweedfs:3.97
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333",
              "-s3.config=/etc/seaweedfs/s3.json",
              "-master.volumeSizeLimitMB=64", "-volume.max=20"]
    volumes:
      - ./s3.json:/etc/seaweedfs/s3.json:ro
  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    command:
      - etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379

  api-gateway:
    <<: *service
    build: {context: ../services, args: {SERVICE: api-gateway}}
    ports: ["127.0.0.1:8000:8000"]
    environment: {<<: *env, POD_NAME: api-gateway}
  auth-service:
    <<: *service
    build: {context: ../services, args: {SERVICE: auth-service}}
    environment: {<<: *env, POD_NAME: auth-service,
                  DB_NAME: auth, DB_USER: auth, DB_PASSWORD: dev-auth}
  user-service:
    <<: *service
    build: {context: ../services, args: {SERVICE: user-service}}
    environment: {<<: *env, POD_NAME: user-service,
                  DB_NAME: users, DB_USER: users, DB_PASSWORD: dev-users}
  list-service:
    <<: *service
    build: {context: ../services, args: {SERVICE: list-service}}
    environment: {<<: *env, POD_NAME: list-service,
                  DB_NAME: lists, DB_USER: lists, DB_PASSWORD: dev-lists}
  task-service:
    <<: *service
    build: {context: ../services, args: {SERVICE: task-service}}
    environment: {<<: *env, POD_NAME: task-service,
                  DB_NAME: tasks, DB_USER: tasks, DB_PASSWORD: dev-tasks}
  tag-service:
    <<: *service
    build: {context: ../services, args: {SERVICE: tag-service}}
    environment: {<<: *env, POD_NAME: tag-service,
                  DB_NAME: tags, DB_USER: tags, DB_PASSWORD: dev-tags}
  comment-service:
    <<: *service
    build: {context: ../services, args: {SERVICE: comment-service}}
    environment: {<<: *env, POD_NAME: comment-service,
                  DB_NAME: comments, DB_USER: comments, DB_PASSWORD: dev-comments}
  attachment-service:
    <<: *service
    build: {context: ../services, args: {SERVICE: attachment-service}}
    environment: {<<: *env, POD_NAME: attachment-service,
                  DB_NAME: attachments, DB_USER: attachments, DB_PASSWORD: dev-attachments, S3_ENDPOINT: 'objectstore:8333'}
  reminder-service:
    <<: *service
    build: {context: ../services, args: {SERVICE: reminder-service}}
    environment: {<<: *env, POD_NAME: reminder-service,
                  DB_NAME: reminders, DB_USER: reminders, DB_PASSWORD: dev-reminders}
  recurrence-service:
    <<: *service
    build: {context: ../services, args: {SERVICE: recurrence-service}}
    environment: {<<: *env, POD_NAME: recurrence-service,
                  DB_NAME: recurrence, DB_USER: recurrence, DB_PASSWORD: dev-recurrence}
  notification-service:
    <<: *service
    build: {context: ../services, args: {SERVICE: notification-service}}
    environment: {<<: *env, POD_NAME: notification-service}
  search-service:
    <<: *service
    build: {context: ../services, args: {SERVICE: search-service}}
    environment: {<<: *env, POD_NAME: search-service,
                  DB_NAME: search, DB_USER: search, DB_PASSWORD: dev-search}
  analytics-service:
    <<: *service
    build: {context: ../services, args: {SERVICE: analytics-service}}
    environment: {<<: *env, POD_NAME: analytics-service}
  audit-service:
    <<: *service
    build: {context: ../services, args: {SERVICE: audit-service}}
    environment: {<<: *env, POD_NAME: audit-service,
                  DB_NAME: audit, DB_USER: audit, DB_PASSWORD: dev-audit}
