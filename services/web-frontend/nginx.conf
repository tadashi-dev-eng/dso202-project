# services/web-frontend/nginx.conf -- TaskFlow
# Serves the built single-page app as an unprivileged user on port 8080
# (no root needed to bind). /api is NOT proxied here: the Ingress routes
# /api to api-gateway before traffic ever reaches this container.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;

  # Writable paths live under /tmp, so the root filesystem can be read-only.
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  # JSON access log: same shape as the Python services, so Loki parses both.
  log_format json escape=json '{"ts":"$time_iso8601","level":"info","service":"web-frontend",'
                              '"msg":"$request_method $uri $status","status":$status,'
                              '"bytes":$body_bytes_sent,"duration":$request_time,'
                              '"client":"$http_x_forwarded_for"}';
  access_log /dev/stdout json;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  server {
    listen 8080;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # Probes: no log noise.
    location = /healthz { access_log off; return 200 "ok\n"; }

    # Stub status for the nginx Prometheus exporter sidecar (Pod-local only).
    location = /stub_status { access_log off; allow 127.0.0.1; deny all; stub_status; }

    # Fingerprinted build assets never change: cache for a year.
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }

    # Single-page app: unknown paths serve index.html.
    location / {
      try_files $uri /index.html;
      add_header Cache-Control "no-cache";
    }
  }
}
